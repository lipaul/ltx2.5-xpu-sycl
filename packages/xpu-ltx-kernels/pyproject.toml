[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-ltx-kernels"
version = "0.1.0"
description = "XPU (Intel GPU) kernels for LTX inference, built with SYCL/ESIMD via icpx"
dependencies = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]